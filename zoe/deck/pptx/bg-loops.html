<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck Background Loops</title>
<style>
  :root { --bg: #000; }
  html, body { margin: 0; background: var(--bg); }
  canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Seamless 8-second background loops for the PowerPoint version of the deck.
// window.setup(mode, keyartDataUrl) then window.frame(t) for t in [0, 8).
// Every motion completes whole cycles in LOOP seconds, so the last frame flows into the first.
const LOOP = 8, W = 1920, H = 1080, TAU = Math.PI * 2;
const cv = document.getElementById('c'), g = cv.getContext('2d');
const CY = [46, 230, 255], GR = [57, 255, 136], PALE = [233, 247, 245];
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

let mode = 'strands', art = null;
const R = rng(7);
// light strands sweeping in from the top, like AMD.com's hero
const strands = Array.from({ length: 46 }, (_, i) => {
  const x0 = 700 + (R() - .5) * 120 + i * 6, c1 = [x0 + 100 + R() * 200, 300 + (R() - .5) * 160 + i * 3];
  const c2 = [1350 + (R() - .5) * 200 + i * 4, 560 + (R() - .5) * 240], end = [1960, 700 + i * 9 + (R() - .5) * 80];
  const col = R() < .7 ? CY : (R() < .6 ? GR : PALE);
  const a = 60 + Math.floor(R() * 200), b = 200 + Math.floor(R() * 400);
  return { p: [[x0, -40], c1, c2, end], col, w: .6 + R() * 1.8, op: .25 + R() * .6, dash: [a, b], cycles: 1 + Math.floor(R() * 2), ph: R() };
});
const fog = Array.from({ length: 14 }, () => ({ x: R() * W, y: 900 + R() * 220, rx: 260 + R() * 260, ry: 70 + R() * 60, a: .05 + R() * .06, ph: R() * TAU, amp: 40 + R() * 80 }));
const grain = (() => { const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d'), r = rng(3); for (let i = 0; i < 6000; i++) { x.strokeStyle = r() < .5 ? `rgba(255,255,255,${r() * .05})` : `rgba(0,0,0,${r() * .1})`; x.lineWidth = 1 + r() * 2.5; const px = r() * W, py = r() * H, l = 6 + r() * 30, a = r() * Math.PI; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); } return c; })();

function path(s) { g.beginPath(); g.moveTo(...s.p[0]); g.bezierCurveTo(...s.p[1], ...s.p[2], ...s.p[3]); }
function drawStrands(t, alpha) {
  g.save(); g.lineCap = 'round'; g.globalCompositeOperation = 'lighter';
  for (const s of strands) {
    path(s); g.setLineDash([]); g.strokeStyle = rgba(s.col, s.op * .3 * alpha); g.lineWidth = s.w; g.stroke();
    const period = s.dash[0] + s.dash[1];
    g.setLineDash(s.dash); g.lineDashOffset = -((t / LOOP) * s.cycles + s.ph) * period * 3;
    g.strokeStyle = rgba(s.col, s.op * alpha); g.lineWidth = s.w * 1.4; path(s); g.stroke();
  }
  g.restore();
}
function drawGlows(t, k = 1) {
  const p = Math.sin(TAU * t / LOOP);
  let rg = g.createRadialGradient(560 + p * 40, -60, 20, 560, -60, 1000); rg.addColorStop(0, rgba(CY, .10 * k)); rg.addColorStop(1, rgba(CY, 0)); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  rg = g.createRadialGradient(960 - p * 60, 1180, 20, 960, 1180, 1100); rg.addColorStop(0, rgba(GR, .14 * k)); rg.addColorStop(1, rgba(GR, 0)); g.fillStyle = rg; g.fillRect(0, 0, W, H);
}
function drawFog(t, k = 1) {
  g.save(); g.filter = 'blur(40px)'; g.globalCompositeOperation = 'lighter';
  for (const f of fog) { g.fillStyle = rgba(GR, f.a * k); g.beginPath(); g.ellipse(f.x + Math.sin(TAU * t / LOOP + f.ph) * f.amp, f.y, f.rx, f.ry, 0, 0, TAU); g.fill(); }
  g.restore();
}
function finish() {
  g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = .5; g.drawImage(grain, 0, 0); g.restore();
  const v = g.createRadialGradient(W / 2, H / 2, 400, W / 2, H / 2, 1250); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.7)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

window.setup = (m, dataUrl) => new Promise(res => {
  mode = m;
  if (!dataUrl) return res();
  art = new Image(); art.onload = () => res(); art.src = dataUrl;
});
window.frame = t => {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  if (mode === 'strands') {
    drawGlows(t); drawFog(t, .6); drawStrands(t, .75);
  } else { // 'title' or 'close': the city key art, slowly breathing, with drifting toxic fog
    const z = 1.06 + 0.025 * Math.sin(TAU * t / LOOP), dx = 18 * Math.sin(TAU * t / LOOP);
    g.save(); g.translate(W / 2 + dx, H / 2); g.scale(z, z); g.drawImage(art, -W / 2, -H / 2, W, H); g.restore();
    drawFog(t, 1.4);
    if (mode === 'title') { // darken the left so the editable title reads
      const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, 'rgba(3,5,5,.92)'); gr.addColorStop(.45, 'rgba(3,5,5,.55)'); gr.addColorStop(1, 'rgba(3,5,5,.1)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    } else {
      const gr = g.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, 1100); gr.addColorStop(0, 'rgba(3,5,5,.55)'); gr.addColorStop(1, 'rgba(3,5,5,.92)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    }
    drawStrands(t, .25);
  }
  finish();
};
window.ready = true;
</script>
</body>
</html>
